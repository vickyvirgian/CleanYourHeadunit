plugins { id 'com.android.application' }
android {
    namespace 'com.dotdrive.launcher'
    compileSdk 34
    defaultConfig { applicationId 'com.dotdrive.launcher'; minSdk 23; targetSdk 34; versionCode 3; versionName '1.1.1' }
    sourceSets.main.assets.srcDir "$rootDir/design/assets"
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
